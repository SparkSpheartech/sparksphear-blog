name: Verify blog domain serves production

# Next.js app: verify the live domain serves the new app (homepage renders the
# brand and a post route answers). No secrets needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: blog-alias
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        domain: [sparkspheartechsolutions.blog, blog.sparkspheartechsolutions.com]
    steps:
      - name: Verify ${{ matrix.domain }} serves the app
        run: |
          set -uo pipefail
          for i in $(seq 1 36); do
            HOME_CODE=$(curl -s -o /tmp/home.html -w '%{http_code}' --max-time 20 "https://${{ matrix.domain }}/?cb=${GITHUB_SHA:0:8}-${i}" || echo 000)
            if [ "$HOME_CODE" = "200" ] && grep -q "SPARKSPHEAR" /tmp/home.html; then
              POST_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://${{ matrix.domain }}/p/x12-837-835-beginner-guide?cb=${GITHUB_SHA:0:8}")
              if [ "$POST_CODE" = "200" ]; then
                echo "OK: ${{ matrix.domain }} is serving this build"
                exit 0
              fi
              echo "attempt $i: post route returned $POST_CODE"
            else
              echo "attempt $i: homepage $HOME_CODE / brand not found"
            fi
            sleep 10
          done
          echo "::warning::${{ matrix.domain }} is not serving ${GITHUB_SHA} yet"
          exit 1
